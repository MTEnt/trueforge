name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.packages.outputs.list }}
      store: ${{ steps.filter.outputs.store }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Detect path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            harness:
              - 'packages/harness/**'
              - '.github/workflows/ci.yml'
            server:
              - 'packages/server/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'packages/frontend/**'
              - '.github/workflows/ci.yml'
            trueforge-ui:
              - 'packages/trueforge-ui-sdk/**'
              - '.github/workflows/ci.yml'
            store:
              - 'packages/server/src/db/**'
              - 'packages/server/tests/db/**'
              - 'packages/server/jest.store.postgres.config.cjs'
              - 'packages/server/jest.store.sqlite.config.cjs'
              - 'packages/server/package.json'
              - 'packages/harness/package.json'
              - 'packages/harness/src/agent-session/store/**'
              - 'packages/harness/tests/agent-session/store/**'
              - '.github/workflows/ci.yml'

      - name: Build package matrix
        id: packages
        env:
          HARNESS: ${{ steps.filter.outputs.harness }}
          SERVER: ${{ steps.filter.outputs.server }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          TRUEFORGE_UI: ${{ steps.filter.outputs['trueforge-ui'] }}
        run: |
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const changedPackages = [];
          if (process.env.HARNESS === 'true') changedPackages.push('harness');
          if (process.env.SERVER === 'true') changedPackages.push('server');
          if (process.env.FRONTEND === 'true') changedPackages.push('frontend');
          if (process.env.TRUEFORGE_UI === 'true') changedPackages.push('trueforge-ui');
          console.log(`list=${JSON.stringify(changedPackages)}`);
          EOF

  # Global: always runs.
  typecheck-and-build:
    name: Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Per changed package: format, lint, test as separate steps.
  # Runs in parallel with typecheck-and-build (time-first). Matrix instances are concurrent.
  package-checks:
    name: Package (${{ matrix.package }})
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm "format:check:${{ matrix.package }}"

      - name: Lint
        run: pnpm "lint:${{ matrix.package }}"

      - name: Test
        run: pnpm "test:${{ matrix.package }}"

  # Store contract suites when store paths change. Parallel with typecheck-and-build.
  store-tests:
    name: Store Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.store == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proto
          POSTGRES_PASSWORD: proto
          POSTGRES_DB: proto
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U proto -d proto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SQLite store tests
        run: pnpm test:store:sqlite

      - name: Postgres store tests
        env:
          SESSION_STORE_TEST_PG_URL: postgres://proto:proto@localhost:55432/proto
        run: pnpm test:store:postgres
