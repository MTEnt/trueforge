{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harness.postgres.fullname" . }}
  labels:
    {{- include "harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "harness.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
{{- end }}
