{{- if not .Values.postgres.auth.existingSecret }}
# Rendered even when the bundled database is disabled: an external Postgres
# still needs its password delivered to the server.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harness.postgres.fullname" . }}
  labels:
    {{- include "harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
